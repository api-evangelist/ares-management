description: >-
  Ares Management Corporation (NYSE: ARES) is a global alternative investment manager founded in 1997
  and headquartered in Los Angeles, investing across credit, real estate, infrastructure, private equity
  and secondaries for institutional and private-wealth clients, with roughly $671 billion of assets under
  management, 60+ offices and about 4,400 employees as stated on its site in September 2026. Its corporate
  web presence moved from aresmgmt.com to ares.com. Ares publishes no public API, developer portal, SDK
  or machine-readable contract; its only investor-facing software surfaces are gated client portals.
